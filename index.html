<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050507"><title>KiLlErZoN3 — Kelvin Repo</title><meta name="description" content="Original iOS tweaks by Kelvin"><meta property="og:image" content="assets/og.png"><link rel="icon" href="assets/kz3-mark.png"><link rel="stylesheet" href="assets/site.css"><link rel="stylesheet" href="assets/refinements.css?v=20260906-1"></head>
<body><main><nav><a class="brand" href="#top"><img src="assets/kz3-mark.png" alt=""><span>KiLlErZoN3</span><em id="country"></em></a></nav>
<section class="hero" id="top"><div class="eyebrow" id="eyebrow"></div><img class="hero-logo" src="assets/kz3-mark.png" alt="KiLlErZoN3 KZ3 logo"><h1><span id="headline-top"></span><br><strong id="headline-accent"></strong></h1><p id="intro"></p><div class="trust" id="trust"></div></section>
<section class="section add"><header><small>ONE TAP. YOU'RE IN.</small><h2 id="add-title"></h2><p id="add-subtitle"></p></header><div class="manager-grid" id="managers"></div><div class="repo-url"><div><small>REPO URL</small><code id="repo-url"></code></div><button id="copy-url">Copy</button></div></section>
<section class="section tweaks"><header><small>FRESH FROM THE LAB</small><h2 id="packages-title"></h2><p id="packages-subtitle"></p></header><div class="category-filter" id="categories"></div><div class="package-grid" id="packages"></div></section>
<section class="section requests" id="requests"><div class="request-shell"><header><small>REQUEST DESK</small><h2 id="request-title">Request a bypass or tweak</h2><p id="request-intro"></p></header><form id="request-form"><div class="form-grid"><label>Request type<select name="request_type" required><option value="">Choose one</option><option>Jailbreak detection bypass</option><option>New tweak</option><option>Existing tweak update</option></select></label><label>App name<input name="app_name" required placeholder="Example: MAE"></label><label>Bundle ID<input name="bundle_id" required placeholder="Example: com.maybank2u.life"></label><label>App version<input name="app_version" required placeholder="Example: 0.9.48"></label><label>Works with Dopamine Hide Jailbreak?<select name="dopamine_hide_jb" required><option value="">Choose one</option><option>Yes</option><option>No</option><option>Partly</option><option>Not tested</option></select></label><label>Jailbreak<select name="jailbreak" required><option value="">Choose one</option><option>Dopamine</option><option>palera1n</option><option>Other</option></select></label><label>Jailbreak version<input name="jailbreak_version" required placeholder="Example: 2.4.1"></label><label>iOS version<input name="ios_version" required placeholder="Example: iOS 17.0"></label><label>iPhone model<input name="iphone_model" required placeholder="Example: iPhone 14 Pro Max"></label><label>Environment<select name="environment" required><option value="">Choose one</option><option>Rootless</option><option>Rootful</option><option>Not sure</option></select></label><label>Your name<input name="requester_name" required placeholder="Name or nickname"></label><label>Your contact<input name="requester_contact" required placeholder="Email, Discord, or Telegram"></label></div><label>Explain the problem<textarea name="details" required rows="5" placeholder="What happens when you open the app? Include any error message and what you already tried."></textarea></label><label class="honeypot" aria-hidden="true">Leave empty<input name="website" tabindex="-1" autocomplete="off"></label><div class="form-consent"><input type="checkbox" name="consent" required id="request-consent"><label for="request-consent">I understand my device and contact details will be sent privately to Kelvin to review this request.</label></div><button type="submit" id="request-submit">Send private request</button><p class="form-status" id="request-status" role="status"></p><p class="privacy-note">Your answers are sent directly to Kelvin’s private inbox. They are never published with the repo or shown to other visitors.</p></form></div></section>
<section class="section connect" id="connect" hidden><header><small>CONNECT & SUPPORT</small><h2 id="developer-name"></h2><p id="developer-bio"></p></header><div class="link-grid" id="contact-links"></div></section>
<footer><div class="brand"><img src="assets/kz3-mark.png" alt=""><span>KiLlErZoN3</span><em>🇲🇾</em></div><p id="footer-copy"></p></footer></main><script src="assets/site.js?v=20260906-1"></script></body></html>
